name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Dameview.slnx

      - name: Test
        run: dotnet test Dameview.slnx --configuration Release --no-restore

      - name: Publish Native AOT executable
        run: dotnet publish src/Dameview/Dameview.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output publish

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\publish\Dameview.exe --verify-tag --generate-notes
